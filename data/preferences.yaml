target_roles:
  - "Data Engineer"
  - "Analytics Engineer"
  - "AI Data Engineer"

work_arrangements:
  remote: true
  hybrid: true
  onsite: true

locations:
  preferred: []
  excluded: []

experience:
  maximum_required_years: 7

seniority:
  allowed:
    - "Entry Level"
    - "Associate"
    - "Mid Level"
    - "Senior"

  excluded:
    - "Staff"
    - "Principal"
    - "Director"
    - "VP"

employment_types:
  - "Full Time"
  - "Contract"

hard_filters:
  active_security_clearance_required: false
  explicit_no_sponsorship: null

scoring:
  auto_apply_minimum: 90
  review_minimum: 80
# Standing preferences used to answer application questions.
relocation:
  willing_anywhere: true      # any U.S. city

onsite:
  willing: true               # onsite, full-time onsite, hybrid / office days

application_defaults:
  preferred_location_fallback: "Philadelphia, PA"   # only when the form has no options
  referral_source: "Company website"
